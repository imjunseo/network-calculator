name: Java TCP tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tcp:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run real TCP integration tests
        run: python3 -m unittest discover -s tests -v
